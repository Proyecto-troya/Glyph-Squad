[project]
name = "leaf-plate-gateway"
version = "0.1.0"
description = "Offline WebSocket gateway in front of a local Ollama server. Laptop tooling only; never a phone-app dependency."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
]

[project.scripts]
leaf-gateway = "gateway.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyyaml>=6",
  "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a real local Ollama at 127.0.0.1:11434"]
addopts = "-q"
timeout = 60
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "examples"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
